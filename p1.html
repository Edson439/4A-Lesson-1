<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Interactivo</title>

  <link rel="stylesheet" href="colorchart.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

	.top-display {
	  display: flex;
	  flex-direction: column;
	  align-items: center;
	  justify-content: center;
	  gap: 35px;
	  margin: -120px 0 0 0;
	  min-height: 520px;
	}

    .selected-letter {
      font-size: 180px;
      font-weight: bold;
      color: black;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 180px;
      flex: 0 0 120px;
      transform: translateY(-5px);
    }

    #revealCircle {
      width: 120px;
      height: 120px;
      max-width: 120px;
      flex: 0 0 220px;
    }

    .thumbnails {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      background-color: white;
      padding: 15px 20px;
      border-radius: 15px;
      border: 2px solid #e6f0ff;
    }

    .thumbnail {
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: bold;
      color: #007bff;
      background-color: #e6f0ff;
      border-radius: 50%;
      cursor: pointer;
    }

    .thumbnail.active {
      background-color: #007bff;
      color: #e6f0ff;
    }

    .thumbnail:hover {
      transform: scale(1.1);
    }
	  .circle {
  border: 2px solid gray;
}

.circle.revealed {
  border: 2px solid transparent;
}
	.circles-row {
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  gap: 10px;
	  min-height: 170px;
	}

	#revealCircle {
	  width: 120px;
	  height: 120px;
	  max-width: 120px;
	  flex: 0 0 140px;
	}
  </style>
</head>

<body>

  <div class="top-display">
    <div class="selected-letter" id="selectedLetter">a</div>
	<div class="circles-row">
	  <div class="circle" id="revealCircle" onclick="toggleReveal(this)">
		<img src="CC/CC-16.png" id="mainImage">
	  </div>
	</div>
  </div>

	<div class="thumbnails">
	  <div class="thumbnail active" onclick="changeImage('CC-16.png','a',this)">a</div>
	  <div class="thumbnail" onclick="changeImage('CC-11.png','e',this)">e</div>
	  <div class="thumbnail" onclick="changeImage('CC-15.png','i',this)">i</div>
	  <div class="thumbnail" onclick="changeImage('CC-17.png','o',this)">o</div>
	  <div class="thumbnail" onclick="changeImage('CC-18.png','u',this)">u</div>
	</div>

  <script>

function changeImage(file, letter, el) {
  const circle = document.getElementById("revealCircle");
  const image = document.getElementById("mainImage");
  const selectedLetter = document.getElementById("selectedLetter");

  circle.classList.remove("revealed");
  selectedLetter.textContent = letter;

  document.querySelectorAll(".thumbnail").forEach(t => t.classList.remove("active"));
  el.classList.add("active");

  setTimeout(() => {
    image.src = "CC/" + file;
  }, 240);
}
	  
function toggleReveal(el) {
  el.classList.toggle("revealed");
}
  </script>

</body>
</html>
