<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Functions of Action to be - Professions</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e6f0ff;
      padding: 28px;
      color: #111111;
    }

    .fatb-wrapper {
	  width: 90%;
	  max-width: 1100px;
	  margin: 0 auto 0 70px;
	}

    .fatb-title {
      width: 90%;
      background: #e6f0ff;
      color: #007bff;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 32px;
    }

    .fatb-content {
      font-size: 28px;
      line-height: 1.45;
      padding: 0 10px;
    }

    .fatb-bold {
      font-weight: 700;
    }
	.patb-key {
	  font-weight: 700;
	  font-style: italic;
	}
    .fatb-section {
      margin-top: 16px;
      margin-left: 48px;
    }

    .fatb-section-title {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 6px;
    }

    .fatb-number {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }

    .fatb-label {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }

    .fatb-description {
      margin-left: 54px;
      margin-bottom: 24px;
    }

    .fatb-examples {
      margin-left: 54px;
    }

    .fatb-example {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }

.patb-finger {
  flex: 0 0 auto;
  font-size: 24px;
}
	  
	  #scroll-indicator {
		  position: fixed;
		  bottom: 20px;
		  left: 50%;
		  transform: translateX(-50%);
		  font-size: 28px;
		  color: #007bff;
		  opacity: 0;
		  transition: opacity 0.3s ease;
		  pointer-events: none;
		}

		#scroll-indicator.show {
		  opacity: 1;
		}
/* Animación suave tipo bounce */
@keyframes bounce {
  0%, 100% {
    transform: translate(-50%, 0);
  }
  50% {
    transform: translate(-50%, 8px);
  }
}

#scroll-indicator.show {
  opacity: 1;
  animation: bounce 1.2s infinite;
}
#teacher {
  position: fixed;
  top: 10px;
  left: 10px; /* ahora a la izquierda */
  width: 60px; /* más pequeño */
  height: 60px;
  background: #ffffff; /* fondo blanco */
  border-radius: 50%; /* círculo */
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  pointer-events: none;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15); /* efecto pro */
}

/* Imagen dentro del círculo */
#teacher img {
  width: 90%;
  height: 90%;
  object-fit: contain;
  border-radius: 50%;
}

/* Animación leve (como “explicando”) */
@keyframes teacherFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}

#teacher {
  animation: teacherFloat 3s ease-in-out infinite;
}
#teacher img {
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
}
	  .inline-icon {
		  height: 30px;
		  vertical-align: middle;
		  margin: 0;
		}
	  
.bottom-image {
  width: 80%;
  margin-top: 10px;
  display: flex;
  justify-content: center;
}

.bottom-image img {
  width: 680px;         /* ajustado al popup */
  height: 320px;        /* 👈 controla cuánto recortas */
  object-fit: cover;    /* 👈 clave: recorta arriba/abajo */
  border-radius: 12px;
}
    @media (max-width: 900px) {
      body {
        padding: 20px;
      }

      .fatb-content {
        font-size: 26px;
      }

      .fatb-section {
        margin-left: 28px;
      }

      .fatb-section-title {
        gap: 16px;
      }

      .fatb-number,
      .fatb-label {
        font-size: 26px;
      }

      .fatb-description,
      .fatb-examples {
        margin-left: 40px;
      }
    }
	  
  </style>
</head>
<body>
  <div class="fatb-wrapper">
    <div class="fatb-title">Say it right!</div>

		<div class="fatb-content">

		  <p>
			When the letter <span class="fatb-bold">“o”</span> is between two consonants in a short word,
		  </p>

		  <p style="margin-top: 20px;">
			it usually sounds like 
			<img src="CC/CC-05.png" class="inline-icon">
			.
		  </p>

		  <!-- 👇 NUEVA IMAGEN -->
		  <div class="bottom-image">
			<img src="images/not.png" alt="example">
		  </div>

		</div>
  </div>
<div id="teacher">
  <img src="images/teacher.png" alt="Teacher">
</div>
<div id="scroll-indicator">
  <i class="fas fa-chevron-down"></i>
</div>
<script>
  function checkScroll() {
    const indicator = document.getElementById('scroll-indicator');

    // Si hay scroll disponible
    const hasScroll = document.body.scrollHeight > window.innerHeight;

    // Si ya está hasta abajo
    const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 5;

    if (hasScroll && !atBottom) {
      indicator.classList.add('show');
    } else {
      indicator.classList.remove('show');
    }
  }

  window.addEventListener('load', checkScroll);
  window.addEventListener('scroll', checkScroll);
  window.addEventListener('resize', checkScroll);

function checkScroll() {
  const indicator = document.getElementById('scroll-indicator');

  const hasScroll = document.body.scrollHeight > window.innerHeight;
  const isNearTop = window.scrollY < 100;
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 5;

  if (hasScroll && isNearTop && !atBottom) {
    indicator.classList.add('show');
  } else {
    indicator.classList.remove('show');
  }
}
</script>
</body>
</html>
